<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wandor</title>
    <meta name="description" content="Wandor runs the coaching room: schedule classes, take attendance, set tests and collect fees." />
    <meta name="theme-color" content="#111111" />
    <!-- Apply stored dark-mode preference before React renders to prevent flash -->
    <script>
      if (localStorage.getItem('wandor_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
